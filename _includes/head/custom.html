---
---

<!-- start custom head snippets -->

<!-- favicon -->
<link rel="icon" type="image/jpeg" href="{{ '/assets/images/dp.jpg' | relative_url }}">
<!-- dark mode (system preference) -->
<link rel="stylesheet" href="{{ '/assets/css/dark.css' | relative_url }}">

<!-- llms.txt discovery (GH Pages cannot send Link headers) -->
<link rel="describedby" type="text/markdown" href="{{ '/llms.txt' | relative_url }}">

<!-- GA4 consent-mode default; runs before gtag.js (loaded at end of body) -->
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('consent', 'default', {'analytics_storage': 'denied'});
</script>

<!-- consent banner -->
<style>
#consent-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  background: #252a34;
  color: #eaeaea;
  font-size: 0.85em;
  padding: 0.75em 1em;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1em;
  box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.3);
}
#consent-banner span {
  margin-right: auto;
}
#consent-banner a {
  color: #00adb5;
  text-decoration: underline;
}
#consent-banner button {
  background: #00adb5;
  color: #fff;
  border: 0;
  border-radius: 4px;
  padding: 0.4em 0.9em;
  margin-left: 0.5em;
  cursor: pointer;
  font-size: 0.9em;
}
#consent-banner button#consent-decline {
  background: transparent;
  color: #eaeaea;
  border: 1px solid #eaeaea;
}
</style>
<div id="consent-banner" role="dialog" aria-label="Cookie consent" aria-describedby="consent-message" hidden>
  <span id="consent-message">This site uses Google Analytics cookies. <a href="{{ '/privacy/' | relative_url }}">Privacy</a></span>
  <span>
    <button id="consent-accept" type="button">Accept</button>
    <button id="consent-decline" type="button">Decline</button>
  </span>
</div>
<script>
(function () {
  var choice = null;
  try { choice = localStorage.getItem('ga-consent'); } catch (e) {}
  var banner = document.getElementById('consent-banner');
  if (choice === 'granted') {
    gtag('consent', 'update', {'analytics_storage': 'granted'});
  } else if (choice === 'denied') {
    // leave default denied, never show banner again
  } else {
    banner.hidden = false;
    document.getElementById('consent-accept').addEventListener('click', function () {
      gtag('consent', 'update', {'analytics_storage': 'granted'});
      try { localStorage.setItem('ga-consent', 'granted'); } catch (e) {}
      banner.hidden = true;
    });
    document.getElementById('consent-decline').addEventListener('click', function () {
      try { localStorage.setItem('ga-consent', 'denied'); } catch (e) {}
      banner.hidden = true;
    });
  }
})();
</script>

<!-- structured data -->
{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "{{ site.title }}",
  "url": "{{ site.url }}"
}
</script>
{% endif %}

{% if page.collection == 'posts' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "{{ page.title }}",
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.date | date_to_xmlschema }}",
  "url": "{{ page.url | absolute_url }}",
  "author": {
    "@type": "Person",
    "name": "{{ site.author.name }}",
    "url": "{{ site.url }}"
  },
  "mainEntityOfPage": "{{ page.url | absolute_url }}"
}
</script>
{% endif %}

<!-- end custom head snippets -->
